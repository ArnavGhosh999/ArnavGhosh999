<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-label="exit 0. thanks for reading.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d10"/><stop offset="1" stop-color="#111820"/></linearGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".07"/></pattern>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#3ddbc0"/><stop offset=".5" stop-color="#c9e88a"/><stop offset="1" stop-color="#ffb454"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <clipPath id="round"><rect width="900" height="160" rx="0"/></clipPath>
  
</defs>
<style>
  text { font-family: 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace; }
  .blob { filter: url(#blur); }
  .b1 { animation: d1 15s ease-in-out infinite alternate; }
  .b2 { animation: d2 19s ease-in-out infinite alternate; }
  @keyframes d1 { from { transform: translate(0,0); } to { transform: translate(220px,30px); } }
  @keyframes d2 { from { transform: translate(0,0); } to { transform: translate(-240px,-20px); } }
  .row { opacity: 0; animation: row 16s ease-out infinite; }
  @keyframes row {
    0% { opacity: 0; transform: translateX(-16px); } 3% { opacity: 1; transform: translateX(0); }
    92% { opacity: 1; transform: translateX(0); } 96% { opacity: 0; } 100% { opacity: 0; } }
  .spine { transform-box: fill-box; transform-origin: top; animation: spine 16s ease-out infinite; }
  @keyframes spine { 0% { transform: scaleY(0); } 18% { transform: scaleY(1); } 92% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
  .dot { transform-box: fill-box; transform-origin: center; animation: dot 3s ease-in-out infinite; }
  @keyframes dot { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
  .cur { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .row { opacity: 1 !important; } }

  .ch { opacity: 0; animation: ch 10s infinite; }
  @keyframes ch { 0% { opacity: 0; } 1% { opacity: 1; } 90% { opacity: 1; } 92% { opacity: 0; } 100% { opacity: 0; } }
  .cm { animation: cm 10s steps(16, end) infinite; }
  @keyframes cm { 0% { transform: translateX(0); } 16% { transform: translateX(250px); } 100% { transform: translateX(250px); } }
  .sp { transform-box: fill-box; transform-origin: center; opacity: 0; animation: up 7s ease-in infinite; }
  @keyframes up { 0% { opacity: 0; transform: translateY(0) rotate(0deg); } 15% { opacity: .9; } 100% { opacity: 0; transform: translateY(-120px) rotate(90deg); } }
  @media (prefers-reduced-motion: reduce) { .ch { opacity: 1 !important; } }
</style>
<g clip-path="url(#round)">
  <rect width="900" height="160" fill="url(#bg)"/>
  <g class="blob" style="mix-blend-mode:screen"><circle class="b1" cx="140" cy="110" r="90" fill="#14b8a6" fill-opacity="0.45"/><circle class="b2" cx="780" cy="130" r="90" fill="#f59e0b" fill-opacity="0.32"/></g>
  <rect width="900" height="160" fill="url(#dots)"/>
  <rect width="900" height="46" fill="#fff" fill-opacity=".03"/>
  <rect y="46" width="900" height="1" fill="#fff" fill-opacity=".08"/>
</g>
<rect x=".5" y=".5" width="899" height="159" rx="0" fill="none" stroke="#fff" stroke-opacity=".24"/>
<rect x="23" y="18" width="10" height="10" fill="#ff8a73"/><rect x="43" y="18" width="10" height="10" fill="#7cb7ff"/><rect x="63" y="18" width="10" height="10" fill="#3ddbc0"/>
<text x="96" y="27" font-size="13" fill="#8a919a">~/exit</text>
<text x="56" y="104" font-size="26" font-weight="700" fill="url(#ink)" textLength="250" lengthAdjust="spacingAndGlyphs"><tspan class="ch" style="animation-delay:0.0s">~</tspan><tspan class="ch" style="animation-delay:0.1s">/</tspan><tspan class="ch" style="animation-delay:0.2s">a</tspan><tspan class="ch" style="animation-delay:0.3s">r</tspan><tspan class="ch" style="animation-delay:0.4s">n</tspan><tspan class="ch" style="animation-delay:0.5s">a</tspan><tspan class="ch" style="animation-delay:0.6s">v</tspan><tspan class="ch" style="animation-delay:0.7s"> </tspan><tspan class="ch" style="animation-delay:0.8s">$</tspan><tspan class="ch" style="animation-delay:0.9s"> </tspan><tspan class="ch" style="animation-delay:1.0s">e</tspan><tspan class="ch" style="animation-delay:1.1s">x</tspan><tspan class="ch" style="animation-delay:1.2s">i</tspan><tspan class="ch" style="animation-delay:1.3s">t</tspan><tspan class="ch" style="animation-delay:1.4s"> </tspan><tspan class="ch" style="animation-delay:1.5s">0</tspan></text><g class="cm"><rect class="cur" x="56" y="82" width="14" height="30" rx="0" fill="#ff8a73"/></g><text x="56" y="140" font-size="14" fill="#8a919a" letter-spacing="1">thanks for reading.</text>

</svg>