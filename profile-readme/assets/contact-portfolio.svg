<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 104" width="300" height="104" role="img" aria-label="portfolio: see the work">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d10"/><stop offset="1" stop-color="#111820"/></linearGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".07"/></pattern>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#3ddbc0" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="round"><rect x="7" width="293" height="104" rx="0"/></clipPath>
</defs>
<style>
  text { font-family: 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace; }
  .blob { filter: url(#blur); animation: d 9s ease-in-out infinite alternate; }
  @keyframes d { from { transform: translate(0,0); } to { transform: translate(90px,10px); } }
  .arrow { animation: nudge 2.4s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { transform: translate(0,0); } 50% { transform: translate(4px,-4px); } }
  .shine { animation: sweep 7s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-120px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(293px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#round)">
  <rect x="7" width="293" height="104" fill="url(#bg)"/>
  <circle class="blob" cx="57" cy="94" r="55" fill="#3ddbc0" fill-opacity=".35" style="mix-blend-mode:screen"/>
  <rect x="7" width="293" height="104" fill="url(#dots)"/>
</g>
<rect x="7.5" y=".5" width="292" height="103" rx="0" fill="none" stroke="#fff" stroke-opacity=".24"/>
<rect x="29" y="22" width="8" height="8" fill="#3ddbc0"/>
<text x="47" y="30" font-size="12" fill="#8a919a">~/portfolio</text>
<text x="33" y="68" font-size="24" font-weight="700" fill="#f1f4f7">portfolio</text>
<text x="33" y="89" font-size="12" fill="#b5bcc6">see the work</text>
<g class="arrow" stroke="#3ddbc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M256 64 L274 46 M260 46 L274 46 L274 60"/>
</g>
</svg>