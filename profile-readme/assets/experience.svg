<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" aria-label="experience: NUS Singapore (feb – jul 2026), explainable image restoration, multimodal tumour segmentation; Carnegie Mellon (oct 2025 – jul 2026), xu lab · reliability guarantees for 3d tumour segmentation; NIT Surathkal (sep 2025 – mar 2026), generalization theory for transformers on noisy nlp; Boltzmann Labs (jun – oct 2025), ai engineer · multi-omics pipelines for mrna therapeutics; Energy7 (mar – jul 2025), ml · graph-based anomaly detection; NIT Kurukshetra (feb 2025 – may 2026), deep learning for indian classical music">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d10"/><stop offset="1" stop-color="#111820"/></linearGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
  <clipPath id="round"><rect width="900" height="530" rx="0"/></clipPath>
  
</defs>
<style>
  text { font-family: 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace; }
  .blob { filter: url(#blur); }
  .b1 { animation: d1 15s ease-in-out infinite alternate; }
  .b2 { animation: d2 19s ease-in-out infinite alternate; }
  @keyframes d1 { from { transform: translate(0,0); } to { transform: translate(220px,30px); } }
  @keyframes d2 { from { transform: translate(0,0); } to { transform: translate(-240px,-20px); } }
  .row { opacity: 0; animation: row 16s ease-out infinite; }
  @keyframes row {
    0% { opacity: 0; transform: translateX(-16px); } 3% { opacity: 1; transform: translateX(0); }
    92% { opacity: 1; transform: translateX(0); } 96% { opacity: 0; } 100% { opacity: 0; } }
  .spine { transform-box: fill-box; transform-origin: top; animation: spine 16s ease-out infinite; }
  @keyframes spine { 0% { transform: scaleY(0); } 18% { transform: scaleY(1); } 92% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
  .dot { transform-box: fill-box; transform-origin: center; animation: dot 3s ease-in-out infinite; }
  @keyframes dot { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
  .cur { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .row { opacity: 1 !important; } }

  .bar { transform-box: fill-box; transform-origin: left center; animation: grow 14s cubic-bezier(.2,.7,.2,1) infinite; }
  @keyframes grow { 0% { transform: scaleX(0); } 12% { transform: scaleX(1); } 92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
  .now { animation: nowp 2.4s ease-in-out infinite; }
  @keyframes nowp { 0%,100% { opacity: .9; } 50% { opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .bar { transform: none !important; } }
</style>
