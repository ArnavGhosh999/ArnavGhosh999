<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 72" width="450" height="72" role="img" aria-label="~/back: level select">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d10"/><stop offset="1" stop-color="#111820"/></linearGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".07"/></pattern>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#7cb7ff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="round"><rect x="0" width="443" height="72" rx="0"/></clipPath>
</defs>
<style>
  text { font-family: 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace; }
  .blob { filter: url(#blur); animation: d 9s ease-in-out infinite alternate; }
  @keyframes d { from { transform: translate(0,0); } to { transform: translate(90px,10px); } }
  .arrow { animation: nudge 2.4s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { transform: translate(0,0); } 50% { transform: translate(4px,0); } }
  .arrow.l { animation-name: nudgel; }
  @keyframes nudgel { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-4px,0); } }
  .shine { animation: sweep 6s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-120px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(443px); opacity: 0; } }
  .seg { opacity: .25; animation: seg 2.4s steps(1) infinite; }
  @keyframes seg { 0%,32% { opacity: .25; } 33%,100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .seg { opacity: 1 !important; } }
</style>
<g clip-path="url(#round)">
  <rect x="0" width="443" height="72" fill="url(#bg)"/>
  <circle class="blob" cx="50" cy="62" r="55" fill="#7cb7ff" fill-opacity=".35" style="mix-blend-mode:screen"/>
  <rect x="0" width="443" height="72" fill="url(#dots)"/>
</g>
<rect x="0.5" y=".5" width="442" height="71" rx="0" fill="none" stroke="#fff" stroke-opacity=".24"/>
<g class="arrow l" stroke="#7cb7ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M44 36.0 L28 36.0 M35 29.0 L28 36.0 L35 43.0"/></g>
<text x="64" y="32" font-size="12" fill="#8a919a" text-anchor="start">~/back</text>
<text x="64" y="53" font-size="20" font-weight="700" fill="#f1f4f7" text-anchor="start">level select</text>
</svg>